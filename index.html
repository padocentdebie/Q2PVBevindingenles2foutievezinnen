<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>PV Bevindingen - Live Emulator</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3_rzoZOWytlyAbYKKe_WuFlD8z2WvbX4",
            authDomain: "aangifteq2les1.firebaseapp.com",
            databaseURL: "https://aangifteq2les1-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "aangifteq2les1",
            storageBucket: "aangifteq2les1.firebasestorage.app",
            messagingSenderId: "1071661084879",
            appId: "1:1071661084879:web:ec81dfed806ad75a8847ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Koppeling tussen zinnen en jouw hilarische afbeeldingen
        const dataSet = [
            { zin: "Deze stoep ligt anders door de straat als normaal een stoep.", img: "hilarisch1.jpg" },
            { zin: "Gezien als je met je rug naar de straatzijde staat.", img: "hilarisch2.jpg" },
            { zin: "Ik zag dat hij na een aantal winkels linksaf sloeg.", img: "hilarisch3.jpg" },
            { zin: "Na het verlaten van de kiosk zag ik dat hij linksaf sloeg.", img: "hilarisch4.jpg" },
            { zin: "Ik zag de jongen een sprong maken als gevolg van een vermoedelijke vlucht.", img: "hilarisch1.jpg" }, // Je kunt hier rouleren
            { zin: "Hij wilde controleren of iemand hem zag.", img: "hilarisch2.jpg" },
            { zin: "Eenmaal buiten zag ik dat de jongen linksaf was geslagen.", img: "hilarisch3.jpg" },
            { zin: "Dat kon ik zien doordat hij één keer over zijn schouder naar het verkeer keek.", img: "hilarisch4.jpg" },
            { zin: "Al bukkend zag ik dat hij met zijn linkerhand de krant opvouwde.", img: "hilarisch1.jpg" }
        ];

        window.nextSentence = () => {
            onValue(ref(db, 'currentStep'), (snapshot) => {
                const current = snapshot.val() || 0;
                const next = (current + 1) % dataSet.length;
                update(ref(db), { currentStep: next });
                remove(ref(db, 'answers')); 
            }, { onlyOnce: true });
        };

        window.resetLesson = () => {
            if(confirm("Database wissen en terug naar het begin?")) {
                set(ref(db), { currentStep: 0, answers: {} });
            }
        };

        window.submitAnswer = () => {
            const name = document.getElementById('studentName').value.trim();
            const text = document.getElementById('improvement').value.trim();
            if(!name || !text) return alert("Vul je naam en verbetering in!");
            
            set(ref(db, 'answers/' + name.replace(/\s+/g, '_')), {
                student: name,
                text: text
            });
            document.getElementById('improvement').value = "";
        };

        onValue(ref(db, 'currentStep'), (snapshot) => {
            const step = snapshot.val() || 0;
            const currentData = dataSet[step];
            document.getElementById('displaySentence').innerText = currentData.zin;
            document.getElementById('stepCounter').innerText = `Oefening ${step + 1} van ${dataSet.length}`;
            document.getElementById('humorImage').src = currentData.img;
        });

        onValue(ref(db, 'answers'), (snapshot) => {
            const container = document.getElementById('stickyContainer');
            container.innerHTML = "";
            const data = snapshot.val();
            if (data) {
                Object.values(data).forEach(ans => {
                    const note = document.createElement('div');
                    note.className = 'sticky-note';
                    note.innerHTML = `<strong>${ans.student}</strong><p>${ans.text}</p>`;
                    container.appendChild(note);
                });
            }
        });
    </script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #dfe6e9; padding: 20px; }
        .app-container { max-width: 900px; margin: auto; }
        .slide { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; }
        .error-sentence { font-size: 1.5em; color: #2d3436; margin: 20px 0; background: #fff3f3; padding: 15px; border-radius: 10px; border-left: 5px solid #d63031; }
        .image-container { width: 100%; max-height: 400px; overflow: hidden; border-radius: 15px; margin-bottom: 20px; border: 3px solid #f1f1f1; }
        .image-container img { width: 100%; height: auto; object-fit: cover; }
        .controls { display: flex; gap: 10px; margin-top: 20px; }
        input { padding: 12px; border: 2px solid #bdc3c7; border-radius: 8px; font-size: 1em; }
        .btn-send { background: #00b894; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        #stickyContainer { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 30px; }
        .sticky-note { background: #ffeaa7; padding: 15px; border-radius: 5px; box-shadow: 3px 3px 10px rgba(0,0,0,0.1); transform: rotate(-1deg); }
        .sticky-note:nth-child(even) { background: #81ecec; transform: rotate(1.5deg); }
        
        .admin-box { position: fixed; bottom: 20px; right: 20px; display: flex; gap: 10px; }
        .btn-admin { padding: 10px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; opacity: 0.7; }
        .btn-admin:hover { opacity: 1; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="slide">
        <h3 id="stepCounter">Laden...</h3>
        <div class="image-container">
            <img id="humorImage" src="" alt="Hilarische situatie">
        </div>
        <div class="error-sentence" id="displaySentence">Laden...</div>
        <div class="controls">
            <input type="text" id="studentName" placeholder="Naam">
            <input type="text" id="improvement" placeholder="Schrijf de verbeterde zin..." style="flex-grow: 1;">
            <button class="btn-send" onclick="submitAnswer()">VERSTUUR</button>
        </div>
    </div>
    <div id="stickyContainer"></div>
</div>

<div class="admin-box">
    <button class="btn-admin" style="background: #0984e3; color: white;" onclick="nextSentence()">VOLGENDE</button>
    <button class="btn-admin" style="background: #636e72; color: white;" onclick="resetLesson()">RESET</button>
</div>

</body>
</html>
