<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>PV Bevindingen - Live Emulator</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3_rzoZOWytlyAbYKKe_WuFlD8z2WvbX4",
            authDomain: "aangifteq2les1.firebaseapp.com",
            databaseURL: "https://aangifteq2les1-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "aangifteq2les1",
            storageBucket: "aangifteq2les1.firebasestorage.app",
            messagingSenderId: "1071661084879",
            appId: "1:1071661084879:web:ec81dfed806ad75a8847ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const dataSet = [
            { zin: "Deze stoep ligt anders door de straat als normaal een stoep.", img: "hilarisch1.jpg" },
            { zin: "Gezien als je met je rug naar de straatzijde staat.", img: "hilarisch2.jpg" },
            { zin: "Ik zag dat hij na een aantal winkels linksaf sloeg.", img: "hilarisch3.jpg" },
            { zin: "Na het verlaten van de kiosk zag ik dat hij linksaf sloeg.", img: "hilarisch4.jpg" },
            { zin: "Ik zag de jongen een sprong maken als gevolg van een vermoedelijke vlucht.", img: "hilarisch1.jpg" },
            { zin: "Hij wilde controleren of iemand hem zag.", img: "hilarisch2.jpg" },
            { zin: "Eenmaal buiten zag ik dat de jongen linksaf was geslagen.", img: "hilarisch3.jpg" },
            { zin: "Dat kon ik zien doordat hij één keer over zijn schouder naar het verkeer keek.", img: "hilarisch4.jpg" },
            { zin: "Al bukkend zag ik dat hij met zijn linkerhand de krant opvouwde.", img: "hilarisch1.jpg" }
        ];

        // --- LOGIN LOGICA ---
        window.onload = () => {
            const savedName = sessionStorage.getItem("studentName");
            if (savedName) {
                showApp(savedName);
            }
        };

        window.login = () => {
            const name = document.getElementById('loginName').value.trim();
            if (name) {
                sessionStorage.setItem("studentName", name);
                showApp(name);
            } else {
                alert("Vul een naam in om te beginnen.");
            }
        };

        function showApp(name) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            document.getElementById('welcome-msg').innerText = "Ingelogd als: " + name;
        }

        // --- DOCENT ACTIES ---
        window.nextSentence = () => {
            onValue(ref(db, 'currentStep'), (snapshot) => {
                const current = snapshot.val() || 0;
                const next = (current + 1) % dataSet.length;
                update(ref(db), { currentStep: next });
                remove(ref(db, 'answers')); 
            }, { onlyOnce: true });
        };

        window.resetLesson = () => {
            if(confirm("Database wissen en terug naar het begin?")) {
                set(ref(db), { currentStep: 0, answers: {} });
            }
        };

        // --- STUDENT ACTIES ---
        window.submitAnswer = () => {
            const name = sessionStorage.getItem("studentName");
            const text = document.getElementById('improvement').value.trim();
            if(!text) return alert("Typ eerst je verbetering!");
            
            set(ref(db, 'answers/' + name.replace(/\s+/g, '_')), {
                student: name,
                text: text
            });
            document.getElementById('improvement').value = "";
        };

        // --- SYNC ---
        onValue(ref(db, 'currentStep'), (snapshot) => {
            const step = snapshot.val() || 0;
            const currentData = dataSet[step];
            document.getElementById('displaySentence').innerText = currentData.zin;
            document.getElementById('stepCounter').innerText = `Oefening ${step + 1} van ${dataSet.length}`;
            document.getElementById('humorImage').src = currentData.img;
        });

        onValue(ref(db, 'answers'), (snapshot) => {
            const container = document.getElementById('stickyContainer');
            container.innerHTML = "";
            const data = snapshot.val();
            if (data) {
                Object.values(data).forEach(ans => {
                    const note = document.createElement('div');
                    note.className = 'sticky-note';
                    note.innerHTML = `<strong>${ans.student}</strong><p>${ans.text}</p>`;
                    container.appendChild(note);
                });
            }
        });
    </script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #dfe6e9; padding: 20px; text-align: center; }
        .box { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
        
        /* Login scherm */
        #login-screen { margin-top: 100px; }
        
        /* App scherm */
        #app-screen { display: none; }
        .error-sentence { font-size: 1.5em; color: #d63031; margin: 20px 0; background: #fff3f3; padding: 15px; border-radius: 10px; border-left: 5px solid #d63031; }
        .image-container { width: 100%; max-height: 350px; overflow: hidden; border-radius: 15px; margin-bottom: 20px; }
        .image-container img { width: 100%; height: auto; }
        
        .controls { display: flex; gap: 10px; margin-top: 20px; }
        input { padding: 15px; border: 2px solid #bdc3c7; border-radius: 8px; font-size: 1em; }
        button { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-main { background: #00b894; color: white; }
        
        #welcome-msg { font-size: 0.8em; color: #636e72; margin-bottom: 10px; }
        
        #stickyContainer { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 30px; }
        .sticky-note { background: #ffeaa7; padding: 15px; border-radius: 5px; box-shadow: 3px 3px 10px rgba(0,0,0,0.1); transform: rotate(-1deg); text-align: left; }
        .sticky-note:nth-child(even) { background: #81ecec; transform: rotate(1.5deg); }
        
        .admin-box { position: fixed; bottom: 20px; right: 20px; display: flex; gap: 10px; }
    </style>
</head>
<body>

    <div id="login-screen" class="box">
        <h1>Welkom bij de PV-Training</h1>
        <p>Vul je naam in om deel te nemen aan de livefeed.</p>
        <input type="text" id="loginName" placeholder="Je volledige naam">
        <button class="btn-main" onclick="login()">START LES</button>
    </div>

    <div id="app-screen">
        <div id="welcome-msg"></div>
        <div class="box">
            <h3 id="stepCounter">Laden...</h3>
            <div class="image-container">
                <img id="humorImage" src="" alt="Situatie">
            </div>
            <div class="error-sentence" id="displaySentence">Laden...</div>
            <div class="controls">
                <input type="text" id="improvement" placeholder="Typ hier de correcte PV-zin..." style="flex-grow: 1;">
                <button class="btn-main" onclick="submitAnswer()">DEEL VERBETERING</button>
            </div>
        </div>

        <div id="stickyContainer"></div>
    </div>

    <div class="admin-box">
        <button onclick="nextSentence()" style="background: #0984e3; color: white;">VOLGENDE DIA</button>
        <button onclick="resetLesson()" style="background: #636e72; color: white;">RESET</button>
    </div>

</body>
</html>
