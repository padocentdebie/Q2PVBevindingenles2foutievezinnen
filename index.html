<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>PV Bevindingen - Live Emulator</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3_rzoZOWytlyAbYKKe_WuFlD8z2WvbX4",
            authDomain: "aangifteq2les1.firebaseapp.com",
            databaseURL: "https://aangifteq2les1-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "aangifteq2les1",
            storageBucket: "aangifteq2les1.firebasestorage.app",
            messagingSenderId: "1071661084879",
            appId: "1:1071661084879:web:ec81dfed806ad75a8847ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const dataSet = [
            { zin: "Deze stoep ligt anders door de straat als normaal een stoep.", img: "falldownviralhog.gif" },
            { zin: "Gezien als je met je rug naar de straatzijde staat.", img: "hilarisch2.jpg" },
            { zin: "Ik zag dat hij na een aantal winkels linksaf sloeg.", img: "missyperegrymstickit.gif" },
            { zin: "Na het verlaten van de kiosk zag ik dat hij linksaf sloeg.", img: "hilarisch4.jpg" },
            { zin: "Ik zag de jongen een sprong maken als gevolg van een vermoedelijke vlucht.", img: "jump.gif" },
            { zin: "Hij wilde controleren of iemand hem zag.", img: "hilarisch2.jpg" },
            { zin: "Eenmaal buiten zag ik dat de jongen linksaf was geslagen.", img: "hilarisch3.jpg" },
            { zin: "Dat kon ik zien doordat hij één keer over zijn schouder naar het verkeer keek.", img: "hilarisch4.jpg" },
            { zin: "Al bukkend zag ik dat hij met zijn linkerhand de krant opvouwde.", img: "hilarisch1.jpg" }
        ];

        window.onload = () => {
            const savedName = sessionStorage.getItem("studentName");
            if (savedName) showApp(savedName);
        };

        window.login = () => {
            const name = document.getElementById('loginName').value.trim();
            if (name) {
                sessionStorage.setItem("studentName", name);
                showApp(name);
            }
        };

        function showApp(name) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            document.getElementById('welcome-msg').innerText = "Ingelogd als: " + name;
        }

        window.nextSentence = () => {
            onValue(ref(db, 'currentStep'), (snapshot) => {
                const current = snapshot.val() || 0;
                const next = (current + 1) % dataSet.length;
                update(ref(db), { currentStep: next });
                remove(ref(db, 'answers')); 
            }, { onlyOnce: true });
        };

        window.resetLesson = () => {
            if(confirm("Database wissen voor de hele groep? Studenten blijven ingelogd.")) {
                set(ref(db), { currentStep: 0, answers: {} });
            }
        };

        window.submitAnswer = () => {
            const name = sessionStorage.getItem("studentName");
            const text = document.getElementById('improvement').value.trim();
            if(!text) return;
            
            set(ref(db, 'answers/' + name.replace(/\s+/g, '_')), {
                student: name,
                text: text
            });
            document.getElementById('improvement').value = "";
        };

        onValue(ref(db, 'currentStep'), (snapshot) => {
            const step = snapshot.val() || 0;
            document.getElementById('displaySentence').innerText = dataSet[step].zin;
            document.getElementById('humorImage').src = dataSet[step].img;
            document.getElementById('stepCounter').innerText = `Vraag ${step + 1} / ${dataSet.length}`;
        });

        onValue(ref(db, 'answers'), (snapshot) => {
            const container = document.getElementById('stickyContainer');
            container.innerHTML = "";
            const data = snapshot.val();
            if (data) {
                Object.values(data).forEach(ans => {
                    const note = document.createElement('div');
                    note.className = 'sticky-note';
                    note.innerHTML = `<strong>${ans.student}</strong><p>${ans.text}</p>`;
                    container.appendChild(note);
                });
            }
        });
    </script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #dfe6e9; padding: 20px; text-align: center; }
        .box { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
        #app-screen { display: none; }
        .image-container { width: 100%; height: 300px; overflow: hidden; border-radius: 10px; margin-bottom: 15px; background: #eee; display: flex; align-items: center; justify-content: center; }
        .image-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .error-sentence { font-size: 1.4em; color: #d63031; font-style: italic; margin-bottom: 20px; padding: 10px; border-left: 5px solid red; background: #fffafa; }
        .controls { display: flex; gap: 10px; }
        input { padding: 12px; border: 2px solid #bdc3c7; border-radius: 8px; flex-grow: 1; }
        button { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        .btn-main { background: #00b894; color: white; }
        #stickyContainer { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 25px; }
        .sticky-note { background: #ffeaa7; padding: 15px; border-radius: 5px; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); transform: rotate(-1deg); text-align: left; animation: popIn 0.3s ease-out; }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1) rotate(-1deg); } }
        .sticky-note:nth-child(even) { background: #81ecec; transform: rotate(1deg); }
        .admin-box { position: fixed; bottom: 15px; right: 15px; display: flex; gap: 5px; opacity: 0.8; }
        .admin-box:hover { opacity: 1; }
    </style>
</head>
<body>
    <div id="login-screen" class="box" style="margin-top: 100px;">
        <h1>PV-Training Inloggen</h1>
        <p>Voer je naam in om deel te nemen.</p>
        <input type="text" id="loginName" placeholder="Voor- en achternaam">
        <button class="btn-main" onclick="login()">START</button>
    </div>

    <div id="app-screen">
        <div id="welcome-msg" style="margin-bottom: 10px; font-size: 0.9em; color: #636e72;"></div>
        <div class="box">
            <h4 id="stepCounter">...</h4>
            <div class="image-container"><img id="humorImage" src=""></div>
            <div class="error-sentence" id="displaySentence"></div>
            <div class="controls">
                <input type="text" id="improvement" placeholder="Schrijf de verbeterde zin...">
                <button class="btn-main" onclick="submitAnswer()">DEEL</button>
            </div>
        </div>
        <div id="stickyContainer"></div>
    </div>

    <div class="admin-box">
        <button onclick="nextSentence()" style="background: #0984e3; color: white;">VOLGENDE DIA</button>
        <button onclick="resetLesson()" style="background: #636e72; color: white;">RESET LES</button>
    </div>
</body>
</html>
