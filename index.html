<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>PV Bevindingen - Interactieve Emulator</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3_rzoZOWytlyAbYKKe_WuFlD8z2WvbX4",
            authDomain: "aangifteq2les1.firebaseapp.com",
            databaseURL: "https://aangifteq2les1-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "aangifteq2les1",
            storageBucket: "aangifteq2les1.firebasestorage.app",
            messagingSenderId: "1071661084879",
            appId: "1:1071661084879:web:ec81dfed806ad75a8847ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // De content per dia
        const dataSet = [
            { zin: "Deze stoep ligt anders door de straat als normaal een stoep.", img: "stoep.jpg" },
            { zin: "Gezien als je met je rug naar de straatzijde staat.", img: "rug.jpg" },
            { zin: "Ik zag dat hij na een aantal winkels linksaf sloeg.", img: "winkels.jpg" },
            { zin: "Na het verlaten van de kiosk zag ik dat hij linksaf sloeg.", img: "kiosk.jpg" },
            { zin: "Ik zag de jongen een sprong maken als gevolg van een vermoedelijke vlucht.", img: "sprong.jpg" },
            { zin: "Hij wilde controleren of iemand hem zag.", img: "kijken.jpg" },
            { zin: "Eenmaal buiten zag ik dat de jongen linksaf was geslagen.", img: "buiten.jpg" },
            { zin: "Dat kon ik zien doordat hij één keer over zijn schouder naar het verkeer keek.", img: "schouder.jpg" },
            { zin: "Al bukkend zag ik dat hij met zijn linkerhand de krant opvouwde.", img: "bukken.jpg" }
        ];

        // --- DOCENT ACTIES ---
        window.nextSentence = () => {
            onValue(ref(db, 'currentStep'), (snapshot) => {
                const current = snapshot.val() || 0;
                const next = (current + 1) % dataSet.length;
                update(ref(db), { currentStep: next });
                remove(ref(db, 'answers')); 
            }, { onlyOnce: true });
        };

        window.resetLesson = () => {
            if(confirm("LET OP: Dit verwijdert alle studenten-input en gaat terug naar zin 1. Doorgaan?")) {
                set(ref(db), { currentStep: 0, answers: {} });
            }
        };

        // --- STUDENT ACTIES ---
        window.submitAnswer = () => {
            const name = document.getElementById('studentName').value.trim();
            const text = document.getElementById('improvement').value.trim();
            if(!name || !text) return alert("Naam en tekst invullen aub!");
            
            set(ref(db, 'answers/' + name.replace(/\s+/g, '_')), {
                student: name,
                text: text
            });
            document.getElementById('improvement').value = "";
        };

        // --- SYNC ---
        onValue(ref(db, 'currentStep'), (snapshot) => {
            const step = snapshot.val() || 0;
            const currentData = dataSet[step];
            document.getElementById('displaySentence').innerText = currentData.zin;
            document.getElementById('stepCounter').innerText = `Oefening ${step + 1} van ${dataSet.length}`;
            // Hier kun je de afbeelding koppelen
            // document.getElementById('humorImage').src = currentData.img; 
        });

        onValue(ref(db, 'answers'), (snapshot) => {
            const container = document.getElementById('stickyContainer');
            container.innerHTML = "";
            const data = snapshot.val();
            if (data) {
                Object.values(data).forEach(ans => {
                    const note = document.createElement('div');
                    note.className = 'sticky-note';
                    note.innerHTML = `<strong>${ans.student}</strong><p>${ans.text}</p>`;
                    container.appendChild(note);
                });
            }
        });
    </script>
    <style>
        body { font-family: 'Comic Sans MS', cursive, sans-serif; background: #fdf6e3; padding: 20px; }
        .app-container { max-width: 1100px; margin: auto; }
        .slide { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; border: 4px solid #3498db; }
        .error-sentence { font-size: 1.8em; color: #d63031; margin: 20px 0; font-weight: bold; }
        .image-placeholder { width: 300px; height: 200px; background: #eee; margin: 10px auto; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .image-placeholder img { max-width: 100%; height: auto; }
        .controls { display: flex; gap: 10px; justify-content: center; margin: 20px 0; }
        input { padding: 15px; border: 2px solid #3498db; border-radius: 8px; }
        
        #stickyContainer { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 30px; }
        .sticky-note { background: #fff740; padding: 15px; transform: rotate(-1deg); box-shadow: 5px 5px 10px rgba(0,0,0,0.1); border-bottom-right-radius: 40px 5px; }
        .sticky-note:nth-child(even) { background: #7afaff; transform: rotate(2deg); }
        
        .admin-zone { position: fixed; bottom: 10px; left: 10px; background: white; padding: 10px; border-radius: 10px; border: 1px solid #ccc; opacity: 0.3; transition: 0.3s; }
        .admin-zone:hover { opacity: 1; }
        button { cursor: pointer; border-radius: 5px; border: none; padding: 10px; font-weight: bold; }
        .btn-go { background: #27ae60; color: white; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="slide">
        <h2 id="stepCounter">Laden...</h2>
        
        <div class="image-placeholder">
            <img id="humorImage" src="https://via.placeholder.com/300x200?text=Hilarische+Illustratie" alt="Grappige situatie">
        </div>

        <div class="error-sentence" id="displaySentence">Laden...</div>
        
        <div class="controls">
            <input type="text" id="studentName" placeholder="Naam student">
            <input type="text" id="improvement" placeholder="Schrijf de zin correct..." style="flex-grow: 1;">
            <button class="btn-go" onclick="submitAnswer()">BOOM! VERBETERD</button>
        </div>
    </div>

    <div id="stickyContainer"></div>
</div>

<div class="admin-zone">
    <strong>DOCENT CONTROLS:</strong><br>
    <button style="background: #3498db; color: white;" onclick="nextSentence()">VOLGENDE DIA ➔</button>
    <button style="background: #e74c3c; color: white;" onclick="resetLesson()">RESET LES</button>
</div>

</body>
</html>
